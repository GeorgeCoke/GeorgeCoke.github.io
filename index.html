        function useScrollReveal() {
          const ref = useRef(null);
          const [isVisible, setIsVisible] = useState(false);

          useEffect(() => {
            const observer = new IntersectionObserver(
              ([entry]) => {
                if (entry.isIntersecting) {
                  setIsVisible(true);
                  observer.unobserve(entry.target);
                }
              },
              { threshold: 0.1 }
            );
            if (ref.current) observer.observe(ref.current);
            return () => observer.disconnect();
          }, []);

          return [ref, isVisible];
        }

                isVisible ? "opacity-100 translate-y-0" : "opacity-0 translate-y-12"
              } ${className}`}
              style={{ transitionDelay: `${delay}ms` }}
            >
              {children}
            </div>

                  </div>
                </FadeInSection>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {PROJECTS.map((project, index) => (
                    <FadeInSection key={project.id} delay={index * 100}>
                      <div 
                        onClick={() => setSelectedProject(project)}
                        className="group relative bg-zinc-900/40 border border-zinc-800/60 rounded-3xl p-8 cursor-pointer overflow-hidden hover:border-zinc-600/50 transition-all duration-500 h-full flex flex-col"
                      >
                        <div className="absolute inset-0 bg-gradient-to-br from-zinc-800/0 via-zinc-800/0 to-zinc-800/20 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                        
                        <div className="relative z-10 flex-grow">
                          <div className="flex justify-between items-start mb-4">
                            <span className="text-xs font-bold px-3 py-1 bg-zinc-800 text-zinc-300 rounded-full">
                              {project.period}
                            </span>
                            <span className="text-xs font-medium px-3 py-1 border border-zinc-700 text-zinc-400 rounded-full">
                              {project.role}
                            </span>
                          </div>
                          <h3 className="text-xl sm:text-2xl font-bold text-white mb-4 group-hover:text-blue-400 transition-colors">
                            {project.title}
                          </h3>
                          <p className="text-zinc-400 text-sm leading-relaxed mb-6">
                            {project.shortDesc}
                          </p>
                        </div>
                        
                        <div className="relative z-10 mt-auto">
                          <div className="flex flex-wrap gap-2 mb-6">
                            {project.tags.map(tag => (
                              <span key={tag} className="text-xs text-zinc-500 bg-black/50 px-2 py-1 rounded-md">
                                #{tag}
                              </span>
                            ))}
                          </div>
                          <div className="flex items-center text-sm font-medium text-white group-hover:translate-x-2 transition-transform">
                            查看详情 <i className="fa-solid fa-chevron-right text-sm ml-1"></i>
                          </div>
                        </div>
                      </div>
                    </FadeInSection>
                  ))}
                </div>
              </section>

              {/* 教育与竞赛 */}
              <section className="py-24 px-6 bg-zinc-900/20 border-y border-zinc-800/50">
                <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-16">
                  
                  {/* 教育背景 */}
                  <div id="education">
                    <FadeInSection>
                      <h2 className="text-2xl font-bold tracking-tight mb-8 flex items-center">
                        <i className="fa-solid fa-graduation-cap text-2xl mr-3 text-zinc-400"></i>
                        教育背景
                      </h2>
                    </FadeInSection>
                    <div className="space-y-8 relative before:absolute before:inset-0 before:ml-2 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-zinc-800 before:to-transparent">
                      {EDUCATION.map((edu, index) => (
                        <FadeInSection key={index} delay={index * 150} className="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
                          <div className="flex items-center justify-center w-5 h-5 rounded-full border-4 border-black bg-zinc-600 group-hover:bg-white transition-colors shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2"></div>
                          <div className="w-[calc(100%-2rem)] md:w-[calc(50%-2rem)] bg-zinc-900/50 p-6 rounded-2xl border border-zinc-800/50 hover:border-zinc-700 transition-colors">
                            <div className="flex justify-between flex-wrap gap-2 mb-2">
                              <h3 className="font-bold text-white text-lg">{edu.school}</h3>
                              <span className="text-sm text-zinc-500 font-medium">{edu.period}</span>
                            </div>
                            <div className="text-blue-400 text-sm font-medium mb-4">{edu.degree}</div>
                            <ul className="space-y-2 text-sm text-zinc-400">
                              {edu.details.map((detail, i) => (
                                <li key={i} className="flex items-start">
                                  <span className="mr-2 mt-1 w-1 h-1 bg-zinc-600 rounded-full shrink-0"></span>
                                  <span className="leading-relaxed">{detail}</span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        </FadeInSection>
                      ))}
                    </div>
                  </div>

                  {/* 竞赛经历 */}
                  <div id="competitions">
                    <FadeInSection>
                      <h2 className="text-2xl font-bold tracking-tight mb-8 flex items-center">
                        <i className="fa-solid fa-trophy text-2xl mr-3 text-zinc-400"></i>
                        竞赛获奖
                      </h2>
                    </FadeInSection>
                    <div className="space-y-6">
                      {COMPETITIONS.map((comp, index) => (
                        <FadeInSection key={comp.id || index} delay={index * 150}>
                          <div 
                            onClick={() => setSelectedCompetition(comp)}
                            className="bg-zinc-900/30 p-6 rounded-2xl border border-zinc-800/50 hover:bg-zinc-800/60 hover:border-zinc-600/50 transition-all cursor-pointer group"
                          >
                            <div className="flex justify-between items-start mb-2">
                              <h3 className="font-bold text-white text-lg group-hover:text-amber-400 transition-colors pr-4">{comp.name}</h3>
                              <i className="fa-solid fa-chevron-right text-lg text-zinc-600 group-hover:text-amber-400 transition-colors shrink-0"></i>
                            </div>
                            <div className="flex items-center gap-3 mb-4">
                              <span className="text-xs font-semibold px-3 py-1 bg-gradient-to-r from-amber-500/20 to-amber-700/20 text-amber-400 rounded-full border border-amber-700/30">
                                {comp.award}
                              </span>
                              <span className="text-xs text-zinc-500">{comp.period}</span>
                            </div>
                            <p className="text-sm text-zinc-400 leading-relaxed">{comp.desc}</p>
                          </div>
                        </FadeInSection>
                      ))}
                    </div>
                  </div>

                </div>
              </section>

              {/* 页脚 */}
              <footer className="py-12 border-t border-zinc-900 text-center text-zinc-500 text-sm">
                <div className="flex justify-center items-center gap-6 mb-4">
                  <a href={`mailto:${PERSONAL_INFO.email}`} className="hover:text-white transition-colors">Email</a>
                  <span className="w-1 h-1 bg-zinc-700 rounded-full"></span>
                  <span>Phone: {PERSONAL_INFO.phone}</span>
                </div>
                <p>© 2026 {PERSONAL_INFO.name}. All rights reserved.</p>
              </footer>

              {/* 模态框 */}
              {(selectedProject || selectedCompetition) && (() => {
                const activeModal = selectedProject || selectedCompetition;
                const isProject = !!selectedProject;
                const close = () => {
                  setSelectedProject(null);
                  setSelectedCompetition(null);
                  setPreviewFile(null);
                };
                
                return (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 md:p-12">
                    <div 
                      className="absolute inset-0 bg-black/80 backdrop-blur-xl transition-opacity animate-in fade-in duration-300"
                      onClick={close}
                    ></div>
                    
                    <div className="relative w-full max-w-5xl h-[85vh] bg-zinc-950 border border-zinc-800 rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-300">
                      
                      {previewFile ? (
                        <div className="absolute inset-0 z-50 bg-zinc-950 flex flex-col animate-in slide-in-from-right-8 duration-300">
                          <div className="flex justify-between items-center p-4 sm:p-6 border-b border-zinc-800 bg-zinc-900/80 backdrop-blur-md shrink-0">
                            <button 
                              onClick={() => setPreviewFile(null)} 
                              className="flex items-center text-zinc-400 hover:text-white transition-colors px-3 py-2 rounded-xl hover:bg-zinc-800"
                            >
                              <i className="fa-solid fa-chevron-left text-lg mr-1"></i> 返回详情
                            </button>
                            <span className="text-sm sm:text-base font-bold text-zinc-300 truncate px-4">
                              {previewFile.title}
                            </span>
                            <button 
                              onClick={close}
                              className="p-2 bg-zinc-900 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-full transition-colors"
                            >
                              <i className="fa-solid fa-xmark text-2xl"></i>
                            </button>
                          </div>
                          <div className="flex-grow relative bg-black flex items-center justify-center overflow-hidden">
                            {previewFile.type === 'pdf' && (
                              <iframe src={previewFile.url} className="w-full h-full border-none bg-zinc-900" title={previewFile.title}></iframe>
                            )}
                            {previewFile.type === 'video' && (
                              <video src={previewFile.url} controls autoPlay className="w-full h-full max-h-full outline-none"></video>
                            )}
                            {previewFile.type === 'image' && (
                              <img src={previewFile.url} alt={previewFile.title} className="max-w-full max-h-full object-contain" />
                            )}
                          </div>
                        </div>
                      ) : (
                        <>
                          <div className="flex justify-between items-start p-6 sm:p-8 border-b border-zinc-800/50 bg-zinc-950/80 backdrop-blur-md sticky top-0 z-10 shrink-0">
                            <div>
                              <span className={`text-xs font-bold tracking-wider mb-2 block uppercase ${isProject ? 'text-blue-400' : 'text-amber-400'}`}>
                                {activeModal.role || activeModal.award} · {activeModal.period}
                              </span>
                              <h2 className="text-2xl sm:text-3xl font-bold text-white tracking-tight leading-tight pr-8">
                                {activeModal.title || activeModal.name}
                              </h2>
                            </div>
                            <button 
                              onClick={close}
                              className="absolute right-6 top-6 sm:right-8 sm:top-8 p-2 bg-zinc-900 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-full transition-colors"
                            >
                              <i className="fa-solid fa-xmark text-2xl"></i>
                            </button>
                          </div>
                          
                          <div className="p-6 sm:p-8 overflow-y-auto flex-grow">
                            <div className="prose prose-invert max-w-none">
                              {typeof activeModal.richDetails === 'function' 
                                ? activeModal.richDetails(setPreviewFile) 
                                : activeModal.richDetails}
                            </div>
                          </div>
                        </>
                      )}
                    </div>
                  </div>
                );
              })()}

            </div>
          );
        }

        // 挂载React应用
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
